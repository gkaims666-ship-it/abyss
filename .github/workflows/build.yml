name: Build Abyss APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish the APK to Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager at: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          GRADLE_VERSION=8.11.1
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "gradle-${GRADLE_VERSION}-bin.zip"
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Surface compiler errors as annotations (readable without downloading logs).
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Could not resolve|> " build.log | grep -v "^> Task" | head -n 40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abyss-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Every build on main also lands in Releases as a plain APK (no zip, no login):
      # https://github.com/<owner>/<repo>/releases/latest/download/Abyss.apk
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" Abyss.apk
          {
            echo "Сборка №${{ github.run_number }} · коммит ${GITHUB_SHA::7}"
            echo
            git log -1 --pretty=%B
          } > notes.md
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Abyss.apk \
            --target "$GITHUB_SHA" \
            --title "Abyss · сборка ${{ github.run_number }}" \
            --notes-file notes.md \
            --latest

      # Also push the APK (split into <100 MB parts, GitHub's per-file limit) to the
      # `apk` branch. Plain git is reachable where release/artifact downloads aren't.
      - name: Publish APK to the apk branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir drop
          cp Abyss.apk drop/
          cd drop
          sha256sum Abyss.apk | cut -d' ' -f1 > Abyss.apk.sha256
          split -b 45m -d Abyss.apk Abyss.apk.part-
          rm Abyss.apk
          echo "Build ${{ github.run_number }} · ${GITHUB_SHA::7}" > BUILD.txt
          git init -q
          git checkout -q -b apk
          git add .
          git -c user.name="abyss-ci" -c user.email="ci@abyss.local" commit -q -m "APK build ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" apk
