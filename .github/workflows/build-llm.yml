name: Build Abyss APK (with local model)

# Heavy, opt-in build that compiles llama.cpp for arm64 into the APK.
# Run it manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager "ndk;27.1.12297006" "cmake;3.22.1" >/dev/null || true

      - name: Download Gradle
        run: |
          GRADLE_VERSION=8.11.1
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "gradle-${GRADLE_VERSION}-bin.zip"
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build debug APK (arm64, with local model)
        run: gradle assembleDebug -PwithLocalLlm --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abyss-debug-apk-llm
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
